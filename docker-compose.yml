version: "3.9"

services:
  db:
    container_name: ads_board_db
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ads_board
      POSTGRES_USER: ads_board_user
      POSTGRES_PASSWORD: ads_board_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ads_board_user -d ads_board"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    container_name: ads_board_web
    build: .
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./static:/app/static
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

volumes:
  postgres_data:
