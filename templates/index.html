<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Доска объявлений</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h1 class="mb-4 text-center">Доска объявлений</h1>

    <ul id="ads-list" class="list-group">
      <p>Это минимальный интерфейс для API. Открой <code>/api/docs/</code> или <code>/api/ads/</code>.</p>
    </ul>

    {% for ad in ads %}
        <div class="card mb-3">
            <div class="card-body">
                <h5 class="card-title">{{ ad.title }}</h5>
                <p class="card-text">{{ ad.description }}</p>
                <p class="text-muted">Автор: {{ ad.author.email }}</p>
            </div>
        </div>
    {% empty %}
        <p>Объявлений пока нет.</p>
    {% endfor %}
  </div>

  <script src="js/main.js"></script>
</body>
</html>
